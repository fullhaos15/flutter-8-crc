name: post_explorer
description: Post Explorer — SRS 8 (Dio, Retrofit, json_serializable, Bloc, кэш).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.0
  retrofit: ^4.10.0
  json_annotation: ^4.12.0
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.17.0
  json_serializable: ^6.15.0
  retrofit_generator: ^10.3.0
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true